name: Release

# Obsidian installs three files from the GitHub release matching the tag, and
# reads the version from the manifest on the default branch. The two must
# agree, so the tag is checked against the manifest before anything is built,
# and the artifacts are produced here from a clean checkout rather than
# uploaded from someone's laptop — what ships is what is in the repo.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  # Required by actions/attest-build-provenance.
  id-token: write
  attestations: write

jobs:
  release:
    name: build + verify + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 24, not 20, because `npm test` runs tests/*.test.ts straight from
          # source using Node's own type stripping. That is what keeps the
          # suite dependency-free and build-step-free, and it needs a Node
          # that can do it: stripping is on by default from 23.6.
          node-version: 24
          cache: npm

      - run: npm ci

      # No BUILD_STAMP: build.js defaults to the manifest version, which makes
      # `npm run build` on this commit produce the byte-identical file. The
      # store's automated review rebuilds from source and diffs against the
      # released asset, and an injected SHA would fail that check for a reason
      # that has nothing to do with the code.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # A release is the last place to find out the manifest is malformed or
      # the README documents a command that was removed.
      - name: Tests
        run: npm test

      # RELEASE_TAG makes check:release additionally assert tag == manifest
      # version. A mismatch is the one release mistake Obsidian cannot recover
      # from, since it fetches assets by tag and reads the version from the
      # manifest.
      - name: Store requirements and plugin guidelines
        run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Checksums
        run: sha256sum main.js manifest.json styles.css | tee checksums.txt

      # Signed provenance for the two built assets, so anyone can verify with
      # `gh attestation verify main.js -R itsyuimorii/obsidian-gemma4-litert-wiki`
      # that this exact file came out of this repository's workflow. The store
      # asks for it, and it is the other half of a reproducible build: the
      # rebuild proves the bytes match the source, the attestation proves who
      # built them.
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'main.js, styles.css'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file <(
              awk '/^## /{n++} n==1' CHANGELOG.md
              echo
              echo '### Install'
              echo
              echo 'Community store: search for **Gemma 4 E4B LLM Wiki**.'
              echo 'Manual: drop `main.js`, `manifest.json` and `styles.css` into'
              echo '`<vault>/.obsidian/plugins/gemma-litert-wiki/`.'
              echo
              echo '### Checksums'
              echo
              echo '```'
              cat checksums.txt
              echo '```'
            ) \
            main.js manifest.json styles.css
