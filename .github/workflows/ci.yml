name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (esbuild bundle)
        run: npm run build
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      # The community store's own rule set (eslint-plugin-obsidianmd), run
      # before a release instead of read in a report after one. The warning
      # budget is exactly the five that point at issue #106; a sixth fails.
      - name: Store lint (eslint-plugin-obsidianmd)
        run: npm run lint
      - name: Release requirements (manifest, versions.json, LICENSE)
        run: npm run check:release
