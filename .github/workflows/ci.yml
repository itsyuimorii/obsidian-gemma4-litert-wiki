name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (esbuild bundle)
        run: npm run build
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
