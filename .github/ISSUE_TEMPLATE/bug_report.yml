name: Something does not work
description: The plugin fails, refuses, or does something you did not expect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Most failures here come down to one of four things — WebGPU, the 3 GB model
        download, the runtime files, or the note itself — and the questions below are the
        ones that tell them apart. The console output is the one that matters most.
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Community store
        - Manually (copied main.js / manifest.json / styles.css)
        - Built from source
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin and Obsidian versions
      description: Settings → Community plugins shows both.
      placeholder: "plugin 1.0.13, Obsidian 1.11.4"
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: OS and GPU
      description: The model runs on your GPU through WebGPU, so this decides a lot.
      placeholder: "macOS 15 / M2 16 GB · Windows 11 / RTX 4060 8 GB · Ubuntu 24.04 / RX 7800"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: How far did it get?
      options:
        - Never saw the model download prompt
        - Download started but did not finish
        - Model loaded, but the first question failed
        - It answered, but the answer was wrong or refused
        - A wiki command (Ingest, Scan, Tidy…) failed
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do, and what happened?
      placeholder: |
        1. Opened a note, ran "Chat with active note"
        2. Typed a question
        3. Got: …
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: |
        Settings → Gemma 4 E4B LLM Wiki → turn on **Developer commands**, reload the plugin,
        reproduce the problem, then open the console (`Cmd/Ctrl+Shift+I` → Console) and paste
        the lines starting with `[gemma-litert-wiki]`. Lines mentioning `mel_filterbank` are
        harmless runtime noise and can be left out.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed any note content from the paste that I would not want public.
