<title>Gemma Wiki Posters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  /* Skim-Recap poster language — light ground, perspective floor, ink headline
     with one violet payoff, letterspaced mono eyebrow, green on-device pill —
     with Obsidian itself as the floating product: the window, the real
     gemma-wiki tree, and the plugin's own panels and modals. Inner colours are
     Obsidian's light theme, same values the demo deck uses. */
  :root {
    --ground: #F1F3F6; --ink: #16181D; --muted: #565C66; --faint: #9AA1AB;
    --accent: #705DCF; --green: #1F9D55; --green-bg: #E5F5EC; --amber: #B4761F; --amber-bg: #FBF1E0;
    --sans: 'Inter', -apple-system, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
    --shadow-lg: 0 46px 90px -30px rgba(24,32,46,.32), 0 10px 26px -12px rgba(24,32,46,.14);
    --ob-bg: #fff; --ob-bg2: #f6f6f7; --ob-bg3: #eceef0; --ob-border: #e2e3e6;
    --ob-text: #222428; --ob-muted: #6e7079; --ob-faint: #9ea0a8;
    --ob-accent: #705dcf; --ob-int: #7b6cd9; --ob-tag: rgba(112,93,207,.12);
  }
  body { margin: 0; background: #DFE3E8; font-family: var(--sans); }
  .sheet { display: flex; flex-direction: column; gap: 40px; padding: 40px; align-items: flex-start; }
  .tag { font: 600 12px/1 var(--mono); letter-spacing: .1em; color: #6B7280; text-transform: uppercase; }

  .poster {
    position: relative; overflow: hidden; width: 1280px; height: 800px; flex: none; color: var(--ink);
    background:
      radial-gradient(900px 560px at 18% 10%, #FDFDFE 0%, transparent 60%),
      radial-gradient(1000px 600px at 90% 90%, #E7EBF0 0%, transparent 55%), var(--ground);
  }
  .floor {
    position: absolute; left: -12%; right: -12%; bottom: -8%; height: 52%;
    background-image: linear-gradient(#CBD2DA 1px, transparent 1px), linear-gradient(90deg,#CBD2DA 1px,transparent 1px);
    background-size: 84px 84px; transform: perspective(900px) rotateX(58deg); transform-origin: 50% 100%;
    opacity: .28; mask-image: linear-gradient(to top, #000 30%, transparent 95%);
  }
  .copy { position: absolute; left: 64px; top: 74px; display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
  .eyebrow { font: 600 13px/1 var(--mono); letter-spacing: .22em; color: var(--faint); text-transform: uppercase; }
  h1 { margin: 0; font-weight: 800; font-size: 54px; line-height: 1.08; letter-spacing: -.028em; text-wrap: balance; }
  h1 .pay { color: var(--accent); }
  .sub { margin: 0; font-weight: 500; font-size: 20px; line-height: 1.5; color: var(--muted); letter-spacing: -.01em; }
  .pill {
    display: inline-flex; align-items: center; gap: 9px; text-transform: uppercase;
    font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--green);
    background: var(--green-bg); border: 1px solid #CDEBDA; border-radius: 999px; padding: 10px 17px;
  }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  /* ---------------- Obsidian window ---------------- */
  .obwin {
    position: absolute; display: flex; flex-direction: column; width: 980px; height: 640px;
    background: var(--ob-bg2); border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow-lg); border: 1px solid rgba(24,32,46,.08); color: var(--ob-text);
  }
  .titlebar { display: flex; align-items: center; height: 36px; padding: 0 14px; background: var(--ob-bg2); border-bottom: 1px solid var(--ob-border); flex: none; }
  .lights { display: flex; gap: 8px; } .lights i { width: 11px; height: 11px; border-radius: 50%; }
  .lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
  .titlebar .vault { flex: 1; text-align: center; font: 500 12px/1 var(--sans); color: var(--ob-faint); }
  .obbody { display: flex; flex: 1; min-height: 0; }
  .explorer { width: 210px; flex: none; background: var(--ob-bg2); border-right: 1px solid var(--ob-border); padding: 10px 8px; box-sizing: border-box; font-size: 13px; overflow: hidden; }
  .fitem { display: flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
  .fitem .chev { color: var(--ob-faint); font-size: 9px; width: 9px; flex: none; }
  .fitem.dim { color: var(--ob-muted); } .fitem.file { padding-left: 24px; color: var(--ob-muted); }
  .fitem.f2 { padding-left: 40px; color: var(--ob-muted); } .fitem.on { background: var(--ob-bg3); color: var(--ob-text); }
  .fitem .dot { margin-left: auto; color: var(--ob-accent); font-size: 9px; }
  .editor { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--ob-bg); }
  .tabs { display: flex; height: 34px; background: var(--ob-bg2); border-bottom: 1px solid var(--ob-border); padding: 0 10px; flex: none; }
  .tab { background: var(--ob-bg); border: 1px solid var(--ob-border); border-bottom: none; border-radius: 6px 6px 0 0; padding: 7px 15px; font-size: 12px; position: relative; top: 5px; }
  .noteview { padding: 24px 32px; overflow: hidden; font-size: 14.5px; line-height: 1.65; }
  .noteview h2 { margin: 0 0 12px; font-size: 25px; letter-spacing: -.015em; }
  .noteview h3 { margin: 18px 0 8px; font-size: 16px; }
  .noteview p { margin: 0 0 12px; } .noteview .wl { color: var(--ob-accent); }
  .noteview ul { margin: 0 0 12px; padding-left: 20px; }
  .noteview .cal { border-left: 3px solid var(--ob-accent); background: var(--ob-tag); border-radius: 6px; padding: 10px 14px; font-size: 13.5px; }
  .tp { display: inline-block; font-size: 12px; color: var(--ob-accent); background: var(--ob-tag); border-radius: 999px; padding: 3px 10px; margin-right: 5px; }

  /* ---------------- the plugin's panel ---------------- */
  .panel {
    position: absolute; width: 372px; display: flex; flex-direction: column; overflow: hidden;
    background: var(--ob-bg); border: 1px solid var(--ob-border); border-radius: 18px; box-shadow: var(--shadow-lg);
  }
  .phead { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--ob-border); }
  .phead svg { width: 17px; height: 17px; flex: none; }
  .phead .t { font: 600 13px/1 var(--sans); }
  .phead .b { font: 600 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ob-accent); background: var(--ob-tag); border-radius: 999px; padding: 4px 8px; }
  .phead .ic { margin-left: auto; color: var(--ob-faint); font-size: 12px; letter-spacing: 3px; }
  .pmsgs { padding: 14px; display: flex; flex-direction: column; gap: 11px; }
  .mq { align-self: flex-end; max-width: 86%; background: var(--ob-bg3); border-radius: 12px 12px 3px 12px; padding: 9px 13px; font-size: 13px; line-height: 1.5; }
  .ma { font-size: 13px; line-height: 1.6; } .ma b { font-weight: 600; }
  .ma .num { color: var(--ob-accent); font: 600 11px/1 var(--mono); margin-right: 6px; }
  .msrc { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .msrc .lbl { font: 600 9px/1 var(--mono); letter-spacing: .1em; color: var(--ob-faint); }
  .msrc .chip { font-size: 11px; color: var(--ob-accent); background: var(--ob-tag); border-radius: 999px; padding: 4px 9px; }
  .pin { margin: 8px 12px 12px; border: 1px solid var(--ob-border); border-radius: 12px; padding: 10px 12px; }
  .pin .ph { font-size: 12px; color: var(--ob-faint); margin-bottom: 9px; }
  .pin .bar { display: flex; align-items: center; gap: 6px; }
  .mode { font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 5px 10px; color: var(--ob-muted); background: var(--ob-bg2); }
  .mode.on { color: #fff; background: var(--ob-int); }
  .send { margin-left: auto; width: 23px; height: 23px; border-radius: 999px; background: var(--ob-int); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .chips3 { display: flex; gap: 6px; padding: 0 12px 4px; flex-wrap: wrap; }
  .attach { display: flex; gap: 6px; align-items: center; margin-bottom: 9px; }
  .att { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ob-muted); background: var(--ob-bg2); border: 1px solid var(--ob-border); border-radius: 999px; padding: 5px 9px; }
  .att .x { color: var(--ob-faint); font-size: 10px; }
  .plus { width: 21px; height: 21px; border-radius: 999px; border: 1px dashed #C9CCD2; color: var(--ob-faint); display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .chip3 { font-size: 11px; color: var(--ob-muted); border: 1px solid var(--ob-border); border-radius: 999px; padding: 6px 11px; }

  /* skills menu */
  .menu { position: absolute; width: 250px; background: var(--ob-bg); border: 1px solid var(--ob-border); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; overflow: hidden; }
  .mi { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 8px; font-size: 13px; }
  .mi .i { width: 15px; text-align: center; color: var(--ob-muted); }
  .mi.hot { background: var(--ob-tag); color: var(--ob-accent); font-weight: 600; }
  .mi.off { color: var(--ob-faint); }
  .mi .own { margin-left: auto; font: 600 9px/1 var(--mono); letter-spacing: .08em; color: var(--ob-faint); }
  .msep { height: 1px; background: var(--ob-border); margin: 5px 4px; }

  /* modal over the window */
  .scrim { position: absolute; inset: 36px 0 0 0; background: rgba(20,22,28,.30); }
  .obmodal { position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%); background: var(--ob-bg); border-radius: 14px; box-shadow: 0 30px 70px -20px rgba(10,14,22,.5); padding: 22px 24px; box-sizing: border-box; }
  .obmodal .mt { font: 700 17px/1.25 var(--sans); color: var(--ob-accent); margin: 0 0 4px; }
  .obmodal .mp { font: 500 11px/1.4 var(--mono); color: var(--ob-faint); margin: 0; }
  .obmodal .msg { font-size: 13px; line-height: 1.55; color: var(--ob-muted); margin: 6px 0 0; }
  .card { margin: 14px 0; border: 1px solid var(--ob-border); border-radius: 10px; padding: 16px 18px; background: #FBFBFC; }
  .card h5 { margin: 0 0 8px; font: 700 16px/1.2 var(--sans); }
  .card p { margin: 0 0 9px; font-size: 13px; line-height: 1.55; color: #3A3E45; }
  .card ul { margin: 0; padding-left: 17px; font-size: 13px; line-height: 1.6; color: #3A3E45; }
  .conf { font: 600 9.5px/1 var(--mono); letter-spacing: .11em; color: var(--green); margin-top: 10px; }
  .btns { display: flex; justify-content: flex-end; gap: 9px; margin-top: 4px; }
  .obbtn { font: 600 12.5px/1 var(--sans); border-radius: 8px; padding: 10px 15px; }
  .obbtn.ghost { color: var(--ob-text); background: var(--ob-bg2); border: 1px solid var(--ob-border); }
  .obbtn.cta { color: #fff; background: var(--ob-int); }
  /* list rows inside modals: scan review, tidy, review board */
  .rows { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  .row { display: flex; align-items: flex-start; gap: 11px; border: 1px solid var(--ob-border); border-radius: 10px; padding: 12px 14px; background: #FBFBFC; }
  .box { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid #C4C7CD; flex: none; margin-top: 1px; }
  .box.tick { background: var(--ob-int); border-color: var(--ob-int); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .row .rt { font: 600 13px/1.35 var(--sans); } .row .rd { font-size: 11.5px; line-height: 1.5; color: var(--ob-muted); margin-top: 3px; }
  .flag { font: 600 9px/1 var(--mono); letter-spacing: .09em; border-radius: 999px; padding: 4px 8px; margin-left: auto; flex: none; }
  .flag.low { color: var(--amber); background: var(--amber-bg); }
  .flag.ok { color: var(--green); background: var(--green-bg); }
  .flag.dr { color: #B4436A; background: #FBE7EE; }

  /* Karpathy three-layer diagram */
  .layers { position: absolute; display: flex; flex-direction: column; gap: 16px; width: 560px; }
  .layer { background: var(--ob-bg); border: 1px solid var(--ob-border); border-radius: 16px; padding: 18px 22px; box-shadow: var(--shadow-lg); }
  .layer .lh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .layer .lname { font: 700 15px/1 var(--sans); }
  .layer .lrole { font: 600 9px/1 var(--mono); letter-spacing: .11em; text-transform: uppercase; border-radius: 999px; padding: 4px 9px; margin-left: auto; }
  .layer .lrole.you { color: var(--green); background: var(--green-bg); }
  .layer .lrole.llm { color: var(--ob-accent); background: var(--ob-tag); }
  .layer .ld { font-size: 12.5px; line-height: 1.55; color: var(--ob-muted); margin: 0 0 10px; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .f { font: 500 11.5px/1 var(--mono); color: var(--ob-muted); background: var(--ob-bg2); border: 1px solid var(--ob-border); border-radius: 6px; padding: 6px 9px; }
  .f.acc { color: var(--ob-accent); background: var(--ob-tag); border-color: transparent; }
  .arrow { display: flex; align-items: center; justify-content: center; gap: 9px; font: 600 10px/1 var(--mono); letter-spacing: .13em; color: var(--faint); text-transform: uppercase; }
  .arrow::before, .arrow::after { content: ''; height: 1px; flex: 1; background: #CFD4DB; }
</style>
<div class="sheet" id="sheet"></div>
<script>
const LOGO = `<svg viewBox="0 0 48 48" fill="none">
  <path d="M9.98 6H38.02a1.92 1.92 0 011.92 1.92V39.98a1.92 1.92 0 01-1.92 1.92H9.98a3.98 3.98 0 01-3.98-3.98V9.98a3.98 3.98 0 013.98-3.98Z" stroke="#705dcf" stroke-width="4" stroke-linejoin="round"/>
  <path d="M14.02 6V42" stroke="#705dcf" stroke-width="4" stroke-linecap="round"/>
  <path d="M27.84 15.84l2.53 5.63 5.63 2.53-5.63 2.53-2.53 5.63-2.53-5.63-5.63-2.53 5.63-2.53Z" fill="#705dcf"/></svg>`;

// The vault tree, matching the real scaffold.
const tree = (open = '') => {
  const r = (c, ch, t, d = '') => `<div class="fitem ${c}"><span class="chev">${ch}</span>${t}${d ? `<span class="dot">${d}</span>` : ''}</div>`;
  const kids = { cards: ['grind-size-and-extraction', 'espresso-extraction-basics', 'water-temperature'],
                 concepts: ['coffee (concept)'], chats: ['gemma — chat — extraction'], skills: ['action-items', 'unclear-bits', 'quiz'] };
  return [
    r('dim', '▸', 'Excalidraw'), r('dim', '▾', 'notes'),
    r('file', '', 'grind size', '●'), r('file', '', 'espresso basics', '●'), r('file', '', 'water temperature', '●'),
    r('on', '▾', 'gemma-wiki'),
    ...['cards', 'chats', 'concepts', 'skills'].flatMap((d) =>
      [r('file', open === d ? '▾' : '▸', d), ...(open === d ? kids[d].map((k) => r('f2', '', k)) : [])]),
    r('file', '', 'index'), r('file', '', 'log'), r('file', '', 'README'), r('file', '', 'schema'),
  ].join('');
};

const win = ({ title, tab, body, tree: open = '', extra = '' }) => `
  <div class="obwin" style="right:-290px; top:96px;">
    <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><div class="vault">${title} — my-vault</div></div>
    <div class="obbody">
      <div class="explorer">${tree(open)}</div>
      <div class="editor"><div class="tabs"><div class="tab">${tab}</div></div><div class="noteview">${body}</div></div>
    </div>${extra}
  </div>`;

const panel = ({ msgs, ph, mode, chips = '', attach = '', pos }) => `
  <div class="panel" style="${pos}">
    <div class="phead">${LOGO}<span class="t">Gemma Wiki</span><span class="b">local</span><span class="ic">💾 🗑</span></div>
    <div class="pmsgs">${msgs}</div>
    ${chips ? `<div class="chips3">${chips}</div>` : ''}
    <div class="pin">${attach ? `<div class="attach">${attach}</div>` : ''}<div class="ph">${ph}</div><div class="bar">
      <span class="mode ${mode === 'note' ? 'on' : ''}">This note</span>
      <span class="mode ${mode === 'wiki' ? 'on' : ''}">Wiki</span><span class="send">➤</span></div></div>
  </div>`;

const NOTE = `<h2>Grind size and extraction</h2>
  <p><span class="tp">#coffee</span><span class="tp">#extraction</span></p>
  <p>Grind size sets how much coffee surface the water can reach. Finer grounds expose more area, so compounds dissolve faster.</p>
  <p>Too fine and the shot over-extracts into bitterness; too coarse and it under-extracts, thin and sour. See <span class="wl">[[espresso extraction basics]]</span>.</p>
  <p>Most guides put the target window at 18–22% for espresso, adjusting grind before anything else.</p>`;

const POSTERS = [
  { id: 'p01', tag: 'hero · chat with a note',
    eyebrow: 'Gemma 4 LiteRT Wiki · Obsidian plugin',
    h1: `Ask your vault. <span class="pay">The model is in the&nbsp;app.</span>`,
    sub: `Gemma 4 answers from your notes, inside Obsidian's own process. No Ollama, no API key, no server.`,
    pill: 'Runs on your device', width: 430,
    art: win({ title: 'grind size and extraction', tab: 'grind size and extraction', body: NOTE }) +
      panel({ pos: 'right:54px; top:150px;', mode: 'note', ph: 'Ask about this note… (Enter to send)',
        attach: `<span class="plus">+</span><span class="att">espresso basics <span class="x">✕</span></span>`,
        msgs: `<div class="mq">Why does grind size change extraction?</div>
          <div class="ma">Finer grounds expose more surface, so water extracts faster — too fine and you cross into bitterness. <b>Your note pins the target window at 18–22%</b>, adjusting grind first.</div>
          <div class="msrc"><span class="lbl">SOURCES</span><span class="chip">grind size</span></div>
          <div class="mq">So why does that make it bitter?</div>
          <div class="ma">Past that window you start pulling the compounds that come out last — the dry, astringent ones. Your note calls it <b>over-extraction</b> rather than "too strong".</div>
          <div class="msrc"><span class="lbl">SOURCES</span><span class="chip">grind size</span><span class="chip">espresso basics</span></div>` }) },

  { id: 'p02', tag: 'chat with the whole wiki',
    eyebrow: 'Index-first retrieval',
    h1: `Ask the whole vault, <span class="pay">not one note at a&nbsp;time.</span>`,
    sub: `Wiki mode reads the index first, opens only the pages that matter, and lists exactly what the answer stood on.`,
    pill: 'Sources listed by the plugin', width: 440,
    art: win({ title: 'index', tab: 'gemma-wiki / index',
      body: `<h2>Wiki Index</h2>
        <p style="color:var(--ob-muted);font-size:13px">One line per page. <b>Wiki-mode chat reads this file first</b> to decide which pages to open.</p>
        <p>• <span class="wl">[[grind-size-and-extraction]]</span> — how grind sets the speed and evenness of extraction</p>
        <p>• <span class="wl">[[espresso-extraction-basics]]</span> — pressure, dose and the 18–22% window</p>
        <p>• <span class="wl">[[water-temperature]]</span> — hotter extracts faster, cooler evens out dark roasts</p>
        <p>• <span class="wl">[[coffee (concept)]]</span> — the page above all six, linking down into each</p>` }) +
      panel({ pos: 'right:54px; top:150px;', mode: 'wiki', ph: 'Ask your wiki… (Enter to send)',
        chips: `<span class="chip3">Scan a folder</span><span class="chip3">Find connections</span><span class="chip3">What's still open?</span>`,
        msgs: `<div class="mq">What connects my coffee notes?</div>
          <div class="ma">All six orbit one idea — <b>extraction control</b>. Grind, water temperature and brew ratio are three levers on the same 18–22% window, and each note adjusts one of them.</div>
          <div class="msrc"><span class="lbl">SOURCES</span><span class="chip">coffee (concept)</span><span class="chip">grind size</span><span class="chip">water temp</span></div>
          <div class="mq">Which one did I never finish?</div>
          <div class="ma">Water temperature — it opens the question of dark roasts and stops there. Nothing else in the wiki picks it up.</div>
          <div class="msrc"><span class="lbl">SOURCES</span><span class="chip">water temp</span><span class="chip">index</span></div>` }) },

  { id: 'p03', tag: "karpathy's llm-wiki structure",
    eyebrow: "Andrej Karpathy's LLM-wiki pattern",
    h1: `Three layers. <span class="pay">Only one of them is&nbsp;yours.</span>`,
    sub: `Raw notes stay immutable. A wiki layer is built above them. The rules live in a note you can edit by hand.`,
    pill: 'Your notes are never modified', width: 430,
    art: `<div class="layers" style="right:80px; top:74px;">
      <div class="layer"><div class="lh"><span class="lname">Your notes</span><span class="lrole you">You own · immutable</span></div>
        <p class="ld">Wherever you already keep them. The model reads and closes; it never edits, moves or renames.</p>
        <div class="files"><span class="f">grind size.md</span><span class="f">espresso basics.md</span><span class="f">water temperature.md</span></div></div>
      <div class="arrow">ingest · one card per note, reviewed</div>
      <div class="layer"><div class="lh"><span class="lname">gemma-wiki/</span><span class="lrole llm">Model maintains</span></div>
        <p class="ld">One card per note, concept pages above them, an index the chat reads first, and an append-only log of everything that ran.</p>
        <div class="files"><span class="f acc">cards/</span><span class="f acc">concepts/</span><span class="f">index.md</span><span class="f">log.md</span><span class="f">chats/</span></div></div>
      <div class="arrow">rules · read before every write</div>
      <div class="layer"><div class="lh"><span class="lname">schema.md</span><span class="lrole you">You own · config</span></div>
        <p class="ld">Your tag vocabulary, naming rules, and a rejected list that outranks the model. Plain markdown you can edit.</p>
        <div class="files"><span class="f">#coffee</span><span class="f">#extraction</span><span class="f">#llm-evaluation</span></div></div>
    </div>` },

  { id: 'p04', tag: 'review-gated ingest',
    eyebrow: 'Nothing is written without approval',
    h1: `Your notes become a wiki. <span class="pay">You approve every&nbsp;page.</span>`,
    sub: `One card per note — summary, tags, key points, and how confident the model was — shown in full before a byte is written.`,
