<meta charset="utf-8">
<body style="margin:0;background:#fff;font-family:Inter,-apple-system,sans-serif;padding:32px">
<h2 style="font-size:16px;margin:0 0 4px">Gemma Wiki — icon candidates</h2>
<p style="font-size:12px;color:#666;margin:0 0 28px">Each has to say two things at once: <b>you can talk to it</b> and <b>a maintained layer grows above your notes</b> (the Karpathy wiki). The three small columns are the real ribbon size.</p>
<div id="grid" style="display:flex;flex-direction:column;gap:6px"></div>
<script>
const W = 'stroke="currentColor" stroke-width="8.3" stroke-linejoin="round" stroke-linecap="round" fill="none"';
const ICONS = [
  ['0 · current', 'bubble + two lines of text + spark', `<path d="M27.1 18.8 H72.9 a14.6 14.6 0 0 1 14.6 14.6 v22.9 a14.6 14.6 0 0 1 -14.6 14.6 H45.8 L27.1 85.4 V70.8 a14.6 14.6 0 0 1 -14.6 -14.6 V33.3 a14.6 14.6 0 0 1 14.6 -14.6 Z" ${W}/><path d="M31.3 39.6 H56.3" ${W}/><path d="M31.3 54.2 H45.8" ${W}/><path d="M68.8 39.6 l3.4 7.7 7.7 3.4 -7.7 3.4 -3.4 7.7 -3.4 -7.7 -7.7 -3.4 7.7 -3.4 Z" fill="currentColor" stroke="none"/>`],

  ['A · graph in a bubble', 'three linked nodes inside a bubble — a cross-linked wiki that talks', `<path d="M27.1 18.8 H72.9 a14.6 14.6 0 0 1 14.6 14.6 v22.9 a14.6 14.6 0 0 1 -14.6 14.6 H45.8 L27.1 85.4 V70.8 a14.6 14.6 0 0 1 -14.6 -14.6 V33.3 a14.6 14.6 0 0 1 14.6 -14.6 Z" ${W}/><path d="M37.5 56.3 L50 35.4 L66.7 52.1" ${W}/><circle cx="37.5" cy="56.3" r="6.3" fill="currentColor"/><circle cx="50" cy="35.4" r="6.3" fill="currentColor"/><circle cx="66.7" cy="52.1" r="6.3" fill="currentColor"/>`],

  ['B · stacked pages + tail', 'two sheets, one on top of the other, with a speech tail — a layer above your notes', `<path d="M33.3 12.5 H79.2 a8.3 8.3 0 0 1 8.3 8.3 V54.2" ${W}/><path d="M20.8 25 H66.7 a8.3 8.3 0 0 1 8.3 8.3 v25 a8.3 8.3 0 0 1 -8.3 8.3 H41.7 L25 85.4 V66.7 a8.3 8.3 0 0 1 -12.5 -8.3 V33.3 a8.3 8.3 0 0 1 8.3 -8.3 Z" ${W}/>`],

  ['C · note + bubble corner', 'a note card with a filled speech bubble at its lower right', `<path d="M22.9 14.6 H58.3 L77.1 33.3 V50" ${W}/><path d="M22.9 14.6 v58.3 a8.3 8.3 0 0 0 8.3 8.3 H45.8" ${W}/><path d="M56.3 12.5 v20.8 h20.8" ${W}/><path d="M60.4 52.1 H83.3 a6.3 6.3 0 0 1 6.3 6.3 v14.6 a6.3 6.3 0 0 1 -6.3 6.3 H70.8 L60.4 91.7 V79.2 a6.3 6.3 0 0 1 -6.3 -6.3 V58.3 a6.3 6.3 0 0 1 6.3 -6.3 Z" fill="currentColor" stroke="none"/>`],

  ['D · three layers', 'three stacked layers — pure wiki, says nothing about chat', `<path d="M50 14.6 L83.3 31.3 L50 47.9 L16.7 31.3 Z" ${W}/><path d="M16.7 50 L50 66.7 L83.3 50" ${W}/><path d="M16.7 68.8 L50 85.4 L83.3 68.8" ${W}/>`],

  ['B2 · stacked pages + spark ★', 'B with a spark — layered, speaking, and a model is doing it', `<path d="M33.3 12.5 H79.2 a8.3 8.3 0 0 1 8.3 8.3 V54.2" ${W}/><path d="M20.8 25 H66.7 a8.3 8.3 0 0 1 8.3 8.3 v25 a8.3 8.3 0 0 1 -8.3 8.3 H41.7 L25 85.4 V66.7 a8.3 8.3 0 0 1 -12.5 -8.3 V33.3 a8.3 8.3 0 0 1 8.3 -8.3 Z" ${W}/><path d="M47.9 37.5 l3.6 8.1 8.1 3.6 -8.1 3.6 -3.6 8.1 -3.6 -8.1 -8.1 -3.6 8.1 -3.6 Z" fill="currentColor" stroke="none"/>`],

  ['B3 · stacked pages + linked nodes', 'B with two linked nodes inside — cross-linking, fewer strokes than a graph', `<path d="M33.3 12.5 H79.2 a8.3 8.3 0 0 1 8.3 8.3 V54.2" ${W}/><path d="M20.8 25 H66.7 a8.3 8.3 0 0 1 8.3 8.3 v25 a8.3 8.3 0 0 1 -8.3 8.3 H41.7 L25 85.4 V66.7 a8.3 8.3 0 0 1 -12.5 -8.3 V33.3 a8.3 8.3 0 0 1 8.3 -8.3 Z" ${W}/><path d="M33.3 54.2 L54.2 39.6" ${W}/><circle cx="33.3" cy="54.2" r="6.3" fill="currentColor"/><circle cx="54.2" cy="39.6" r="6.3" fill="currentColor"/>`],

  ['E · bubble, one line, bigger spark', 'the current mark simplified — one line fewer, a larger spark', `<path d="M27.1 18.8 H72.9 a14.6 14.6 0 0 1 14.6 14.6 v22.9 a14.6 14.6 0 0 1 -14.6 14.6 H45.8 L27.1 85.4 V70.8 a14.6 14.6 0 0 1 -14.6 -14.6 V33.3 a14.6 14.6 0 0 1 14.6 -14.6 Z" ${W}/><path d="M31.3 47.9 H52.1" ${W}/><path d="M68.8 33.3 l4.6 10.4 10.4 4.6 -10.4 4.6 -4.6 10.4 -4.6 -10.4 -10.4 -4.6 10.4 -4.6 Z" fill="currentColor" stroke="none"/>`],

  ['F · two bubbles', 'a large bubble and a small one — dialogue itself, with no wiki signal', `<path d="M20.8 20.8 H62.5 a12.5 12.5 0 0 1 12.5 12.5 v16.7 a12.5 12.5 0 0 1 -12.5 12.5 H37.5 L20.8 77.1 V62.5 a12.5 12.5 0 0 1 -12.5 -12.5 V33.3 a12.5 12.5 0 0 1 12.5 -12.5 Z" ${W}/><path d="M79.2 41.7 h4.2 a8.3 8.3 0 0 1 8.3 8.3 v12.5 a8.3 8.3 0 0 1 -8.3 8.3 v12.5 L70.8 70.8" ${W}/>`],
];
document.getElementById('grid').innerHTML = ICONS.map(([name, desc, body]) => `
<div style="display:flex;align-items:center;gap:28px;padding:16px 18px;border:1px solid #e2e3e6;border-radius:10px">
  <div style="width:220px;flex-shrink:0">
    <div style="font-size:13px;font-weight:600">${name}</div>
    <div style="font-size:11.5px;color:#6e7079;line-height:1.5;margin-top:3px">${desc}</div>
  </div>
  <div style="color:#222"><svg viewBox="0 0 100 100" width="64" height="64">${body}</svg></div>
  <div style="color:#6e7079;padding:5px;border-radius:6px"><svg viewBox="0 0 100 100" width="18" height="18">${body}</svg></div>
  <div style="color:#7b6cd9;background:#f0eefb;padding:5px;border-radius:6px"><svg viewBox="0 0 100 100" width="18" height="18">${body}</svg></div>
  <div style="background:#1e1e1e;padding:7px;border-radius:6px;color:#ccc"><svg viewBox="0 0 100 100" width="18" height="18">${body}</svg></div>
</div>`).join('');
</script>
</body>
