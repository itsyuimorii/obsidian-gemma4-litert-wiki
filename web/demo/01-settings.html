<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 01 · Settings — Gemma Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='7' fill='%237C5CFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="demo-shared.css">
</head>
<body>

<div class="environment"></div>
<div class="grid-floor"></div>
<div class="ambient-blob blob-a"></div>

<div class="scene-title" id="sceneTitle">
    <div class="num">Scene 01 — Settings</div>
    <div class="txt">Everything the plugin will do to your vault, before it does any of it.</div>
</div>

<div class="stage"></div>

<div class="keycap-overlay" id="keycapOverlay"></div>
<div class="proto-badge" id="protoBadge"><span class="d"></span>Prototype · scripted mock-up</div>
<div class="hint-bar" id="hintBar"><kbd>Space</kbd> next · <kbd>R</kbd> restart · <kbd>H</kbd> hide chrome</div>

<script src="demo-runner.js"></script>
<script src="ob-shell.js"></script>
<script>
const { $, $$, typeHTML, flashKeys, beat, notice, clearNotices, status } = GemmaDemo;

OB.render({
    vault: 'itsyuimorii2026',
    tab: { name: 'Reading queue', icon: 'file-text' },
    words: '27 notes',
    tree: [
        { name: 'research', kind: 'folder' },
        { name: 'Reading queue', kind: 'file', indent: 1, active: true, id: 'queue' },
        { name: 'webmcp notes', kind: 'file', indent: 1, id: 'webmcp' },
        { name: 'agent interfaces', kind: 'file', indent: 1, id: 'agentif' },
    ],
    editor: '<h1>Reading queue</h1><p>Notes I keep meaning to go back to.</p>',
});

/* ---------- The settings pane, copied item by item from settings.ts ---------- */
const slider = (id, pct, val) =>
    `<span class="set-slider"><span class="track"><span class="knob" id="${id}" style="left:${pct}%"></span></span><span class="val" id="${id}-v">${val}</span></span>`;

const SETTINGS = `
<div class="ob-settings" id="settings">
    <div class="set-nav">
        <div class="grp">Options</div>
        <div class="it">Editor</div>
        <div class="it">Files and links</div>
        <div class="it">Appearance</div>
        <div class="grp">Community plugins</div>
        <div class="it on">Gemma Wiki</div>
        <div class="it">Dataview</div>
        <div class="it">Templater</div>
    </div>
    <div class="set-pane" id="pane">
        <div class="set-title">Gemma Wiki</div>
        <div class="set-sub">Local-first LLM wiki. Gemma 4 runs inside Obsidian via LiteRT-LM and WebGPU.</div>

        <div class="set-head">Model</div>
        <div class="set-item" id="s-model">
            <span class="info">
                <div class="nm">Local model</div>
                <div class="ds" id="modelDesc">Not downloaded yet (~2.97 GB, one time). Downloads on first use, or start it here.</div>
            </span>
            <span class="ctl"><span class="set-btn cta" id="btnDownload">Download model</span></span>
        </div>

        <div class="set-head">Wiki</div>
        <div class="set-item" id="s-folder">
            <span class="info">
                <div class="nm">Knowledge folder name</div>
                <div class="ds">The one folder the plugin writes to. Your own notes are never moved or modified. Changing this renames the folder and rewrites internal links; blank resets to the default.</div>
            </span>
            <span class="ctl">
                <span class="set-text">gemma-wiki</span>
                <span class="set-btn off">Apply</span>
            </span>
        </div>
        <div class="set-item" id="s-map" style="display:block;">
            <div class="folder-map">
                <div class="fm-row"><span class="fm-path">gemma-wiki/sources/</span><span class="fm-what">One page per ingested note</span><span class="fm-state">✓</span></div>
                <div class="fm-row"><span class="fm-path">gemma-wiki/answers/</span><span class="fm-what">Chat answers you saved</span><span class="fm-state">✓</span></div>
                <div class="fm-row"><span class="fm-path">gemma-wiki/chats/</span><span class="fm-what">Saved conversations</span><span class="fm-state">✓</span></div>
                <div class="fm-row"><span class="fm-path">gemma-wiki/concepts/</span><span class="fm-what">Pages built across a shared tag</span><span class="fm-state">✓</span></div>
                <div class="fm-row"><span class="fm-path">gemma-wiki/skills/</span><span class="fm-what">One file per ⚡ menu entry</span><span class="fm-state">✓</span></div>
                <div class="fm-row"><span class="fm-path is-link">gemma-wiki/index.md</span><span class="fm-what">Catalog — wiki chat reads this first</span><span class="fm-state">✓</span></div>
                <div class="fm-row"><span class="fm-path is-link">gemma-wiki/log.md</span><span class="fm-what">Append-only record of what ran</span><span class="fm-state">✓</span></div>
                <div class="fm-row"><span class="fm-path is-link">gemma-wiki/schema.md</span><span class="fm-what">Tag vocabulary, naming rules, rejected tags</span><span class="fm-state">✓</span></div>
            </div>
        </div>
        <div class="set-item" id="s-repair">
            <span class="info">
                <div class="nm">Folders</div>
                <div class="ds">All present. These are created when Obsidian starts; this button is only for putting one back.</div>
            </span>
            <span class="ctl"><span class="set-btn" id="btnRepair">Repair folders</span></span>
        </div>

        <div class="set-head">Schema</div>
        <div class="set-item" id="s-schema">
            <span class="info">
                <div class="nm">Tag vocabulary &amp; naming rules</div>
                <div class="ds">Tag rules live in schema.md, not here — config as a note; open it from the list above. "Organize tags" has local Gemma merge near-synonyms into one vocabulary and writes it back for you to review.</div>
            </span>
            <span class="ctl"><span class="set-btn">Organize tags</span></span>
        </div>

        <div class="set-head">Skills</div>
        <div class="set-item" id="s-skills">
            <span class="info">
                <div class="nm">Custom skills</div>
                <div class="ds">One file per skill in skills/ — frontmatter for name/icon/mode, the body is the prompt. Each file becomes an entry in the ⚡ menu of the chat panel.</div>
            </span>
            <span class="ctl"><span class="set-btn">Open skills folder</span></span>
        </div>

        <div class="set-head">Chat</div>
        <div class="set-item" id="s-chat">
            <span class="info">
                <div class="nm">Default mode</div>
                <div class="ds">Which grounding mode a new chat panel opens in.</div>
            </span>
            <span class="ctl"><span class="set-drop">This note</span></span>
        </div>

        <div class="set-head">Review</div>
        <div class="set-item" id="s-stale">
            <span class="info">
                <div class="nm">Stale after (days)</div>
                <div class="ds">The review board flags pages untouched for this many days.</div>
            </span>
            <span class="ctl">${slider('slStale', 20, '30')}</span>
        </div>

        <div class="set-head">Scan for new notes</div>
        <div class="set-item" id="s-scannow">
            <span class="info">
                <div class="nm">Scan now</div>
                <div class="ds">Sweep the folders below for new or changed notes, draft a card for each, and review them all at once before anything is written. One model call per note, so it takes a while — you can close this window and keep working.</div>
            </span>
            <span class="ctl"><span class="set-btn" id="btnScan">Scan now</span></span>
        </div>
        <div class="set-item" id="s-include">
            <span class="info">
                <div class="nm">Scan these folders</div>
                <div class="ds">Scan only looks at notes under these folders. Everything else in your vault is left alone. <b>Leave blank and scan has nothing to do</b> — this is opt-in on purpose.</div>
            </span>
            <span class="ctl"><span class="set-text" id="includeVal"><span class="ph">走り書き, research</span></span></span>
        </div>
        <div class="set-item" id="s-max">
            <span class="info">
                <div class="nm">Max notes per scan</div>
                <div class="ds">Cap each scan so a large backlog does not run the GPU through dozens of notes at once.</div>
            </span>
            <span class="ctl">${slider('slMax', 31, '10')}</span>
        </div>
        <div class="set-item" id="s-exclude">
            <span class="info">
                <div class="nm">Exclude folders</div>
                <div class="ds">Optional: within the scanned folders above, skip these sub-paths. The wiki folder is always excluded.</div>
            </span>
            <span class="ctl"><span class="set-text"><span class="ph">Templates, 10_リソース</span></span></span>
        </div>
        <div class="set-item" id="s-bg">
            <span class="info">
                <div class="nm">Show a background "to review" count</div>
                <div class="ds">Periodically COUNT new/changed notes and show them in the status bar. Counting is instant and never runs the model — drafting only happens when you click the chip. Default off.</div>
            </span>
            <span class="ctl"><span class="set-toggle" id="tgBg"></span></span>
        </div>
    </div>
</div>`;

const BG_KNOBS = `
<div class="set-item fresh" id="s-quiet">
    <span class="info">
        <div class="nm">Quiet period (hours)</div>
        <div class="ds">Background auto-scan skips notes edited within this many hours — you may still be writing them. Manual "Scan now" always includes them.</div>
    </span>
    <span class="ctl">${slider('slQuiet', 12, '3')}</span>
</div>
<div class="set-item fresh" id="s-recount">
    <span class="info">
        <div class="nm">Re-count every (hours)</div>
        <div class="ds">How often the background count refreshes while Obsidian is open.</div>
    </span>
    <span class="ctl">${slider('slRecount', 22, '6')}</span>
</div>`;

const ONBOARDING = `
<div class="head"><h3>Download the local model</h3></div>
<div class="scroll">
    <p style="margin-bottom:11px;">Gemma Wiki is completely free — no API key, no subscription, no usage fees, ever.
    The model runs entirely on your machine, so ingest and chat as much as you want. It downloads once,
    then works fully offline.</p>
    <ul style="margin-left:18px;line-height:1.75;">
        <li>Size: ~2.97 GB, downloaded one time and cached on disk.</li>
        <li>Free space: keep ~5 GB free for the download and its temporary file.</li>
        <li>Runs on your GPU via WebGPU — desktop only, no cloud, no API key.</li>
        <li>If the download is interrupted, run it again — it resumes where it stopped.</li>
    </ul>
</div>
<div class="foot">
    <button class="ob-btn">Not now</button>
    <button class="ob-btn cta" id="btnConfirm">Download model</button>
</div>`;

/* Light only the setting currently being narrated. */
function lit(id, say) {
    $$('.set-item').forEach((el) => el.classList.remove('lit'));
    if (id) $(id).classList.add('lit');
    if (say) beat(say);
}

let dlNotice = null;

GemmaDemo.init([
    { do: () => {
        beat('The plugin is installed. Before it has read a single note, everything it is <i>allowed</i> to do is on one page — so this is where the demo starts, not with a command.');
    }},

    { lock: 900, do: () => {
        flashKeys(['⌘', ',']);
        $('.stage').insertAdjacentHTML('beforeend', '');
        $('#host').insertAdjacentHTML('beforeend', SETTINGS);
        beat(null);
    }},

    { lock: 700, do: () => {
        lit('#s-model', 'Two sections matter on day one. This is the first: <b>the model is not there yet.</b> Nothing has been downloaded, and the plugin says so rather than fetching three gigabytes in the background.');
    }},

    { lock: 900, do: () => {
        $('#btnDownload').classList.add('pressed');
        OB.modal(ONBOARDING, 'narrow');
        beat('Three gigabytes gets a real consent screen. <b>“Not now” is a supported answer</b> — the plugin simply stays inert until you say yes.');
    }},

    { lock: 1200, do: () => {
        OB.closeModal();
        dlNotice = notice('Preparing model download…');
        beat(null);
        setTimeout(() => (dlNotice.textContent = 'Checking for an existing model…'), 800);
        setTimeout(() => (dlNotice.textContent = 'Downloading model (first run, ~3GB)…'), 1600);
    }},

    { lock: 5600, do: () => {
        beat('Streamed to disk in chunks, one range request. Interrupt it and press the button again — it resumes from the byte it stopped at, and the button relabels itself <i>Resume download</i>.');
        let mb = 0;
        const t = setInterval(() => {
            mb += 330;
            if (mb >= 2970) {
                clearInterval(t);
                dlNotice.textContent = 'Model ready. Size: 2.97 GB';
                setTimeout(() => dlNotice.classList.add('leaving'), 1600);
                $('#modelDesc').textContent = 'Downloaded (2.97 GB on disk). Completely free — runs offline on your GPU, no API key or subscription.';
                $('#btnDownload').textContent = 'Re-download';
                $('#btnDownload').classList.remove('cta', 'pressed');
            } else {
                dlNotice.textContent = `Downloading model… ${mb} / 2970 MB`;
            }
        }, 380);
    }},

    { lock: 900, do: () => {
        clearNotices();
        lit('#s-folder', 'The second thing that matters: <b>one folder</b>. That is the entire footprint. Rename it here and every page moves with every internal link rewritten.');
    }},

    { lock: 900, do: () => {
        lit('#s-map', 'And this is what is inside it. The list is generated from the same array the scaffold builds from, so the documentation and the behaviour cannot drift apart.');
    }},

    { lock: 900, do: () => {
        lit('#s-repair', 'Note what this button is <b>not</b>: it is not how the folders get made. They are made on startup. It reads out whether any went missing — sync clients drop empty directories often enough that the recovery path has to exist.');
    }},

    { lock: 800, do: () => {
        lit('#s-schema', '<b>Config as a note.</b> The tag vocabulary is not a hidden setting — it is <code>schema.md</code>, opened straight from the list above. What stays here is <i>Organize tags</i>, because that one is an action, not a place.');
    }},

    { lock: 800, do: () => {
        lit('#s-skills', 'Same idea for the ⚡ menu: one markdown file per skill. Frontmatter for the name and icon, the body <i>is</i> the prompt.');
    }},

    { lock: 800, do: () => {
        lit('#s-chat', 'Two grounding modes — one open note, or the whole wiki. This picks which one a new panel opens in.');
    }},

    { lock: 800, do: () => {
        $('#pane').scrollTop = 400;
        lit('#s-stale', 'The review board needs a definition of "old". Thirty days by default.');
    }},

    { lock: 900, do: () => {
        lit('#s-include', 'The single most important setting on this page, and it ships <b>blank</b>. Scan looks only at folders you name here — leave it empty and scan refuses to run rather than sweeping your whole vault.');
        setTimeout(() => typeHTML('#includeVal', 'research', { speed: 60 }), 500);
    }},

    { lock: 900, do: () => {
        lit('#s-max', 'A cap, because a scan is one model call per note and a 200-note backlog would occupy the GPU for an hour.');
    }},

    { lock: 900, do: () => {
        lit('#s-bg', 'And the background count, <b>off by default</b>. Turning it on does not run the model — it only counts.');
    }},

    { lock: 1100, do: () => {
        $('#tgBg').classList.add('on');
        $('#s-bg').insertAdjacentHTML('afterend', BG_KNOBS);
        beat('Turn it on and two more knobs appear. They were hidden because they only mean something in background mode — a user who just clicks "Scan now" never has to meet the concept.');
    }},

    { lock: 900, do: () => {
        $$('.set-item').forEach((el) => el.classList.remove('lit'));
        $('#settings').remove();
        beat('That is the whole surface. Nothing here reaches the network, and nothing outside <code>gemma-wiki/</code> is ever written.');
    }},

    { do: () => {
        beat('Next: what those folders actually look like once Obsidian has created them.');
    }},
]);
</script>
</body>
</html>
