<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 01 · First run — Gemma Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%233CDA6B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="demo-shared.css">
</head>
<body>

<div class="environment"></div>
<div class="grid-floor"></div>
<div class="ambient-blob blob-a"></div>
<div class="ambient-blob blob-b"></div>

<div class="scene-title" id="sceneTitle">
    <div class="num">Scene 02 — First run</div>
    <div class="txt">What the plugin puts in your vault, and the three gigabytes it asks for once.</div>
</div>

<div class="stage"></div>

<div class="keycap-overlay" id="keycapOverlay"></div>
<div class="proto-badge" id="protoBadge"><span class="d"></span>Prototype · scripted mock-up</div>
<div class="hint-bar" id="hintBar"><kbd>Space</kbd> next · <kbd>R</kbd> restart · <kbd>H</kbd> hide chrome</div>

<script src="demo-runner.js"></script>
<script src="ob-shell.js"></script>
<script>
const { $, $$, typeHTML, flashKeys, beat, notice, clearNotices, status, progress } = GemmaDemo;

/* A vault that already has notes, before the plugin is installed. */
const WELCOME = `
<h1>Reading queue</h1>
<p>Notes I keep meaning to go back to. Right now this is a pile, not a library.</p>
<ul>
    <li>webmcp notes</li>
    <li>agent interfaces</li>
    <li>litert on device</li>
    <li>embedding models in the browser</li>
    <li class="muted">…23 more</li>
</ul>
`;

/* Before the plugin: only the user's own notes. */
const BASE_TREE = [
    { name: 'research', kind: 'folder' },
    { name: 'Reading queue', kind: 'file', indent: 1, active: true, id: 'queue' },
    { name: 'webmcp notes', kind: 'file', indent: 1, id: 'webmcp' },
    { name: 'agent interfaces', kind: 'file', indent: 1, id: 'agentif' },
    { name: 'litert on device', kind: 'file', indent: 1, id: 'litert' },
];

OB.render({
    vault: 'itsyuimorii2026',
    tab: { name: 'Reading queue', icon: 'file-text' },
    words: '27 notes',
    tree: BASE_TREE,
    editor: WELCOME,
});

/* What ensureWikiScaffold() creates, in the order wikiScaffoldPaths() returns. */
const SCAFFOLD = [
    { row: { name: 'gemma-wiki', kind: 'folder', id: 'gw' },
      say: 'The one folder the plugin writes to. Everything above it is yours and stays untouched.' },
    { row: { name: 'sources', kind: 'folder', indent: 1, id: 'gw-sources' },
      say: '<code>sources/</code> — one page per note you ingest. Summary, key points, tags, and the model\'s own confidence.' },
    { row: { name: 'answers', kind: 'folder', indent: 1, id: 'gw-answers' },
      say: '<code>answers/</code> — chat replies you decided to keep, so a good answer stops being disposable.' },
    { row: { name: 'chats', kind: 'folder', indent: 1, id: 'gw-chats' },
      say: '<code>chats/</code> — whole conversations, saved from the panel header.' },
    { row: { name: 'concepts', kind: 'folder', indent: 1, id: 'gw-concepts' },
      say: '<code>concepts/</code> — pages built <i>across</i> everything that shares a tag. This is where the wiki grows a second storey.' },
    { row: { name: 'skills', kind: 'folder', indent: 1, id: 'gw-skills' },
      say: '<code>skills/</code> — one file per entry in the ⚡ menu. It ships with a README and two examples, so the menu is not empty on day one.' },
    { row: { name: 'index.md', kind: 'file', indent: 1, id: 'gw-index' },
      say: '<code>index.md</code> — the catalog. One line per page, and the first thing wiki-mode chat reads before it opens anything.' },
    { row: { name: 'log.md', kind: 'file', indent: 1, id: 'gw-log' },
      say: '<code>log.md</code> — append-only record of what ran and when. Nothing reads it back; it exists so you can check.' },
    { row: { name: 'schema.md', kind: 'file', indent: 1, id: 'gw-schema' },
      say: '<code>schema.md</code> — your tag vocabulary, the naming rules, and the tags you rejected. Config as a note: edit it and the plugin obeys it.' },
];

const INDEX_OPEN = `
<h1>Wiki Index</h1>
<div class="fm" style="white-space:normal;line-height:1.7;">
    <b>ⓘ What this file is</b> — The wiki's directory: one line per page, a link then a one-sentence
    summary. Wiki-mode chat reads this file FIRST to decide which pages to open.
</div>
<div class="fm" style="white-space:normal;line-height:1.7;">
    <b>ⓘ Where things go</b> — This folder is the only thing the plugin writes.
    <b>Your own notes are never modified.</b><br>
    <code>sources/</code> one page per ingested note · <code>answers/</code> saved chat answers ·
    <code>chats/</code> saved conversations · <code>concepts/</code> pages across a shared tag ·
    <code>skills/</code> one file per ⚡ menu entry
</div>
<p class="muted">No entries yet — nothing has been ingested.</p>
`;

const ONBOARDING = `
<div class="head">
    <h3>Download the local model</h3>
</div>
<div class="scroll">
    <p style="margin-bottom:11px;">Gemma Wiki is completely free — no API key, no subscription, no usage fees, ever.
    The model runs entirely on your machine, so ingest and chat as much as you want. It downloads once,
    then works fully offline.</p>
    <ul style="margin-left:18px;line-height:1.75;">
        <li>Size: ~2.97 GB, downloaded one time and cached on disk.</li>
        <li>Free space: keep ~5 GB free for the download and its temporary file.</li>
        <li>Runs on your GPU via WebGPU — desktop only, no cloud, no API key.</li>
        <li>If the download is interrupted, run it again — it resumes where it stopped.</li>
    </ul>
</div>
<div class="foot">
    <button class="ob-btn">Not now</button>
    <button class="ob-btn cta" id="btnDl">Download model</button>
</div>`;

let dlNotice = null;

GemmaDemo.init([
    { do: () => {
        beat('A vault that already has notes in it. The plugin is installed but Obsidian has not restarted yet — so far it has created <b>nothing</b>.');
    }},

    { lock: 900, do: () => {
        beat('Restart. The folders are built on layout-ready, not on the first write — an empty plugin that has created nothing is one you cannot read.');
        flashKeys(['⌘', 'R']);
    }},

    // Build them one at a time, with a line about each.
    ...SCAFFOLD.map((entry, i) => ({
        lock: 500,
        do: () => {
            OB.addRow(entry.row, i === 0 ? null : SCAFFOLD[i - 1].row.id);
            beat(entry.say);
        },
    })),

    { lock: 800, do: () => {
        beat('Nine things, none of them in your way. And no <code>raw/</code> folder — where your own notes live is your business, not the plugin\'s.');
    }},

    { lock: 900, do: () => {
        $('#tab').innerHTML = icon('library') + '<span>Wiki Index</span>';
        $('#editor').innerHTML = INDEX_OPEN;
        $$('.ob-row').forEach((r) => r.classList.remove('active'));
        $('#row-gw-index')?.classList.add('active');
        beat('Open <code>index.md</code> and the layout explains itself, in a collapsed callout. The same list is generated in Settings from the same source, so the two can never disagree.');
    }},

    { lock: 1200, do: () => {
        beat('Now the part everyone asks about. First, can this machine even run it?');
        flashKeys(['⌘', 'P']);
        OB.palette('Check WebGPU', [
            { name: 'Gemma Wiki: [Test] Check WebGPU', icon: 'cpu' },
            { name: 'Gemma Wiki: [Test] Load WASM runtime (no model download)', icon: 'cpu' },
        ]);
    }},

    { lock: 900, do: () => {
        OB.closePalette();
        notice('WebGPU OK — Adapter found. {"vendor":"apple","architecture":"metal-3","device":"","description":""}', 5200);
        beat('A real adapter, in Obsidian\'s own renderer. Nothing was installed alongside — no Ollama, no LM Studio, no local server, no port.');
    }},

    { lock: 1000, do: () => {
        beat(null);
        flashKeys(['⌘', 'P']);
        OB.palette('Download model', [
            { name: 'Gemma Wiki: Download model (one-time, ~3GB)', icon: 'download' },
        ]);
    }},

    { lock: 1100, do: () => {
        OB.closePalette();
        OB.modal(ONBOARDING, 'narrow');
        beat('Three gigabytes is a real cost and it gets a real consent screen, not a silent background fetch. <b>Not now</b> is a supported answer.');
    }},

    { lock: 1400, do: () => {
        $('#btnDl').classList.add('pressed');
        OB.closeModal();
        dlNotice = notice('Preparing model download…');
        beat(null);
        setTimeout(() => dlNotice.textContent = 'Checking for an existing model…', 900);
        setTimeout(() => dlNotice.textContent = 'Downloading model (first run, ~3GB)…', 1800);
    }},

    { lock: 6200, do: () => {
        beat('One HTTP range request, streamed to disk in chunks. Interrupt it and run the command again — it picks up from the byte it stopped at.');
        progress(null, 0, 0, 0); // progress lives in the notice text, as it does in the real UI
        let mb = 0;
        const t = setInterval(() => {
            mb += 260;
            if (mb >= 2970) {
                mb = 2970;
                clearInterval(t);
                dlNotice.textContent = 'Model ready. Size: 2.97 GB';
                setTimeout(() => { dlNotice.classList.add('leaving'); }, 1800);
            } else {
                dlNotice.textContent = `Downloading model… ${mb} / 2970 MB`;
            }
        }, 380);
    }},

    { lock: 900, do: () => {
        clearNotices();
        status('Loading model…');
        beat('First load compiles GPU shaders — that is the ~28 s cold start in the benchmarks. It is a one-time cost, not a per-call tax.');
    }},

    { lock: 1200, do: () => {
        status(null);
        notice('Engine ready.', 3200);
        beat('From here on the network is never touched again. Everything in the rest of this deck runs on this machine, offline.');
    }},

    { do: () => {
        beat('Next: fill it. <b>Scan</b> ingests a stack of notes in one pass — that is where the wiki actually starts.');
    }},
]);
</script>
</body>
</html>
