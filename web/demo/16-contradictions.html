<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 16 · Contradictions — Gemma Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='7' fill='%237C5CFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="demo-shared.css">
</head>
<body>

<div class="environment"></div>
<div class="grid-floor"></div>
<div class="ambient-blob blob-a"></div>

<div class="scene-title" id="sceneTitle">
    <div class="num">Scene 16 — Contradictions</div>
    <div class="txt">Two pages disagree. Both are quoted; neither is corrected.</div>
</div>

<div class="stage"></div>

<div class="keycap-overlay" id="keycapOverlay"></div>
<div class="proto-badge" id="protoBadge"><span class="d"></span>Prototype · scripted mock-up</div>
<div class="hint-bar" id="hintBar"><kbd>Space</kbd> next · <kbd>R</kbd> restart · <kbd>H</kbd> hide chrome</div>

<script src="demo-runner.js"></script>
<script src="ob-shell.js"></script>
<script>
const { $, $$, typeHTML, flashKeys, beat, notice, status, statusDone, statusReview, reveal, progress } = GemmaDemo;


OB.render({
    tab: { name: 'index.md', icon: 'file-text' },
    tree: VAULT.tree('full', 'gw-index'),
    editor: '',
});

GemmaDemo.init([
    { do: () => {
        beat('A vault accumulates for years. Two notes written eight months apart, on the same subject, that quietly say opposite things — and you have never had them on screen together.');
    }},

    { lock: 1300, do: () => {
        OB.palette('contradict', [{ name: 'Gemma Wiki: Find contradictions in wiki (local Gemma)', icon: 'scale' }]);
    }},

    { lock: 1200, do: () => {
        OB.closePalette();
        flashKeys(['↵']);
        status('Checking 3/12 — litert-on-device vs webmcp-notes…');
        beat('It only compares pages that <b>share a tag</b>. Every pair in a wiki is quadratic and most pairs are about nothing in common; a shared tag is the cheap filter that makes this affordable at all.');
    }},

    { lock: 2600, do: () => {
        status('Checking 9/12 — browser-apis vs litert-on-device…', { keep: true });
        beat('Most recently changed first, so if it cannot finish, the pairs it did check are the ones you most likely just disturbed.');
    }},

    { lock: 1800, do: () => {
        status(null);
        OB.modal(`
            <div class="head"><h3>Contradiction candidates</h3></div>
            <div class="scroll">
                <p class="lint-summary">Checked 12 of 12 tag-sharing page pairs. 1 flagged for a human look — these are candidates, not verdicts.</p>
                <div class="sxs" id="sxs">
                    <div class="col"><h4>litert-on-device</h4><div class="body">
                        <p class="quote">Context is <em>8192 tokens</em> on this machine — I re-ran it after the driver update. The 4096 figure was the old default, not a limit.</p>
                        <p style="margin-top:8px;font-size:11.5px;color:var(--text-faint)">filed 2026-09-01 · from research/litert on device.md</p>
                    </div></div>
                    <div class="col"><h4>browser-apis</h4><div class="body">
                        <p class="quote">Everything has to fit in <em>4096 tokens</em>, which is the hard ceiling on this class of model and is not configurable.</p>
                        <p style="margin-top:8px;font-size:11.5px;color:var(--text-faint)">filed 2026-01-14 · from research/browser apis.md</p>
                    </div></div>
                </div>
                <p class="lint-summary" style="margin-top:14px">Both pages state a context limit and the numbers disagree. One says 4096 is a hard ceiling; the other says it was a default and measures 8192.</p>
                <p class="hintline">Open both pages, check them against their source notes, and re-ingest whichever drifted. Nothing was changed.</p>
            </div>
            <div class="foot"><button class="ob-btn cta">Close</button></div>`, 'wide');
        beat('Side by side, <b>quoted</b>. Not paraphrased, not adjudicated — the exact sentences, with the dates, so you can see which one you wrote when you knew less.');
    }},

    { lock: 2400, do: () => {
        beat('And it changes <b>nothing</b>. It does not pick a winner, does not edit either page, does not add a note saying "superseded". A 4-billion-parameter model resolving a conflict between two things you wrote is not an outcome anyone should want.');
    }},

    { lock: 2000, do: () => {
        beat('You know something it does not: that the January note was written before the driver update. Only you can know that, so only you get to decide.');
    }},

    { lock: 1700, do: () => {
        OB.closeModal();
        beat('And the fix goes where every fix goes — into the <b>note</b>, not the card. Open research/browser apis.md, correct the sentence, and the drift flag pulls the card along behind it.');
    }},

    { do: () => {
        beat('Which is the same move as scene 14, arriving from the other direction. Finding the contradiction is new; what you do about it is the one habit the whole plugin is built around.');
    }},
]);

</script>
</body>
</html>
