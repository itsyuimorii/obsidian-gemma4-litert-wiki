<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 12 · Save as note — Gemma Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='7' fill='%237C5CFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="demo-shared.css">
</head>
<body>

<div class="environment"></div>
<div class="grid-floor"></div>
<div class="ambient-blob blob-a"></div>

<div class="scene-title" id="sceneTitle">
    <div class="num">Scene 12 — Save as note</div>
    <div class="txt">The answer lands in your notes, named so you can tell what it is.</div>
</div>

<div class="stage"></div>

<div class="keycap-overlay" id="keycapOverlay"></div>
<div class="proto-badge" id="protoBadge"><span class="d"></span>Prototype · scripted mock-up</div>
<div class="hint-bar" id="hintBar"><kbd>Space</kbd> next · <kbd>R</kbd> restart · <kbd>H</kbd> hide chrome</div>

<script src="demo-runner.js"></script>
<script src="ob-shell.js"></script>
<script>
const { $, $$, typeHTML, flashKeys, beat, notice, status, statusDone, statusReview, reveal, progress } = GemmaDemo;


OB.render({
    tab: { name: 'litert on device', icon: 'file-text' },
    tree: VAULT.tree('filed', 'litert'),
    editor: `<h1>litert on device</h1><p>Context is 4096 tokens. That is the real constraint on
everything else.</p>`,
});
['litert', 'webmcp', 'agentif', 'browserapi'].forEach(OB.badge);

const ANS = `Three threads run through all four pages. <b>The browser is the runtime</b> — LiteRT-LM in the renderer, WebGPU for the model, WebMCP through <code>document.modelContext</code>. <b>Identity is missing everywhere</b> — WebMCP cannot tell two agents apart, and the interface notes hit the same wall from the design side. <b>The cost is one-time, then flat.</b>`;

GemmaDemo.init([
    { do: () => {
        OB.openRight(GW.panel('', 'wiki', {
            messages: `<div class="gw-msg user">what keeps coming up across all of these?</div>
                       <div class="gw-msg bot" id="ans">${ANS}${GW.sources(['litert on device','webmcp notes','agent interfaces','browser apis'])}${GW.actions({ saveLabel: 'Save as note' })}</div>`,
        }));
        beat('A connection you did not have written down anywhere. Right now it lives in a chat panel, which means in four days it does not live anywhere.');
    }},

    { lock: 1200, do: () => {
        $('#btnSaveBack').classList.add('lit');
        beat('The button says <b>Save as note</b>, and the word matters. An earlier version said "Save to wiki" and wrote into <code>gemma-wiki/answers/</code> — a folder nothing in the plugin ever read.');
    }},

    { lock: 1700, do: () => {
        OB.modal(`
            <div class="head">
                <h3>Review note before writing</h3>
                <div class="path">Will create: research/gemma — what keeps coming up across all of these.md</div>
            </div>
            <div class="scroll md">
                <p class="fmtext">---
written_by: gemma-4-E4B-it-web
created: 2026-09-03
sources:
  - "[[litert on device]]"
  - "[[webmcp notes]]"
  - "[[agent interfaces]]"
  - "[[browser apis]]"
---</p>
                <h1>what keeps coming up across all of these?</h1>
                <p>Three threads run through all four pages.</p>
                <p><strong>The browser is the runtime.</strong> LiteRT-LM in the renderer process, WebGPU for the
                model, WebMCP through <code>document.modelContext</code> — none of these pages assumes a server.</p>
                <p><strong>Identity is missing everywhere.</strong> WebMCP has no notion of which agent is calling.</p>
                <p><strong>The cost is one-time, then flat.</strong></p>
                <h2>Sources</h2>
                <ul><li><a class="wl">[[litert on device]]</a></li><li><a class="wl">[[webmcp notes]]</a></li>
                <li><a class="wl">[[agent interfaces]]</a></li><li><a class="wl">[[browser apis]]</a></li></ul>
            </div>
            <div class="foot"><span class="note">Beside the note it came from.</span><button class="ob-btn">Cancel</button><button class="ob-btn cta" id="ok">Approve and write</button></div>`);
        beat('Same preview gate as an ingest. Read the path: <code>research/</code>, <b>not <code>gemma-wiki/</code></b> — it goes beside the note it was grounded in, with no folder picker to answer.');
    }},

    { lock: 2200, do: () => {
        beat('The frontmatter is two facts and no bookkeeping. <code>written_by</code> and <code>sources</code> are exactly what a copy-paste destroys silently — and they are the only reason a button beats Cmd+C at all.');
    }},

    { lock: 2000, do: () => {
        beat('No <code>tags:</code>. Choosing what a file in <i>your</i> folder is about is not the plugin\'s call — when this note is later ingested, its <b>card</b> gets tags, which is where model-chosen tags belong.');
    }},

    { lock: 1500, do: () => { $('#ok').classList.add('pressed'); }},

    { lock: 1600, do: () => {
        OB.closeModal();
        OB.addRow({ name: 'gemma — what keeps coming…', kind: 'file', indent: 1, badge: true, id: 'own-1' }, 'browserapi');
        notice('✅ Saved: research/gemma — what keeps coming up across all of these.md', 6000);
        beat('There it is, in <code>research/</code> with your four notes. And look at the name.');
    }},

    { lock: 1800, do: () => {
        $('#editor').innerHTML = `<div class="md" style="padding:24px 28px">
            <h1>Why the name is shaped like that</h1>
            <p class="fmtext" style="font-size:13px">gemma — Summarize — The perfect espresso shot
└─┬──┘   └───┬───┘   └────────────┬──────────┘
  │          │                    └── what it was about
  │          └── what it did
  └── who wrote it</p>
            <div class="kv"><div class="k"><code>gemma —</code></div><div class="v">The only marker the file explorer can show. It renders no frontmatter and truncates around thirty characters, so a suffix or a property is invisible exactly when you are scanning a folder to tell your own writing from the model's.</div></div>
            <div class="kv"><div class="k">Action first</div><div class="v">Several answers about one note are told apart by <b>what was asked</b>, not by the topic they share. Topic-first renders them identical:<br>
              <span class="fmtext">gemma — Summarize — The perfe…&nbsp;&nbsp;&nbsp;gemma — The perfect espress…<br>gemma — Summarize — Brewing t…&nbsp;&nbsp;&nbsp;gemma — The perfect espress…</span></div></div>
            <div class="kv"><div class="k">Topic last</div><div class="v">And only when there is <b>exactly one source</b>. A wiki answer can read four cards; naming it after the first claims it is about one note when it is about the set.</div></div>
        </div>`;
        reveal('.kv', 230);
        beat('Three parts, and the order is doing work. This one had four sources, so it carries no topic — the question is the whole name.');
    }},

    { lock: 2600, do: () => {
        beat('The case that forced this: the <b>Summarize</b> chip sends the prompt <i>"Summarize this note"</i>, which names no note. Two saves in one folder used to give you that and <i>"Summarize this note 2"</i>.');
    }},

    { lock: 2000, do: () => {
        status('Drafting 1/1 — gemma — what keeps coming… · Extracting');
        beat('And now the part <code>answers/</code> could never do. It is an ordinary note of yours, so the next scan sees it.');
    }},

    { lock: 2400, do: () => {
        status(null);
        OB.badge('own-1');
        OB.addRow({ name: 'gemma-what-keeps-coming-up', kind: 'file', indent: 2, id: 'c-own' }, 'gw-cards');
        notice('✅ Wiki page written: gemma-wiki/cards/gemma-what-keeps-coming-up.md', 5000);
        beat('Carded like anything else — retrieved, indexed, on the review board, drift-tracked. <b>Through the front door</b>, which is the only one that leads there.');
    }},

    { do: () => {
        beat('A saved answer in <code>answers/</code> could not do that: scanning skips the whole of <code>gemma-wiki/</code>, so it sat in the one place the ingest pipeline is hard-coded to walk past.');
    }},
]);

</script>
</body>
</html>
